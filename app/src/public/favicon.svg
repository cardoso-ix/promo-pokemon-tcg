<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe033"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3de6ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Ring with Shadow -->
  <circle cx="32" cy="32" r="30" fill="#0b0914" stroke="url(#foilGrad)" stroke-width="2.5" />
  
  <!-- Top Half (Foil Gold Metallic) -->
  <path d="M 4 32 A 28 28 0 0 1 60 32 Z" fill="url(#foilGrad)" />
  
  <!-- Bottom Half (Deep Purple/Black Arena) -->
  <path d="M 4 32 A 28 28 0 0 0 60 32 Z" fill="#171326" />
  
  <!-- Center Divider Belt -->
  <rect x="2" y="29.5" width="60" height="5" fill="#0b0914" />
  
  <!-- Outer Center Button (Electric Cyan Glow) -->
  <circle cx="32" cy="32" r="10" fill="#0b0914" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Inner Center Core Button -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" />
</svg>
