<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Réplica Promo Cockpit</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(17, 20, 30, 0.75);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-border-focus: rgba(255, 215, 0, 0.45);
      --primary-gold: #ffd700;
      --primary-cyan: #00f0ff;
      --text-main: #f0f2f5;
      --text-muted: #8b949e;
      --danger: #ff4d4f;
      --success: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
      animation: pulse-glow 8s infinite alternate ease-in-out;
    }

    .glow-gold {
      top: -100px;
      left: -100px;
      background: radial-gradient(circle, #ffd700 0%, transparent 70%);
    }

    .glow-cyan {
      bottom: -100px;
      right: -100px;
      background: radial-gradient(circle, #00f0ff 0%, transparent 70%);
      animation-delay: -4s;
    }

    @keyframes pulse-glow {
      0% { transform: scale(0.9) translate(0, 0); opacity: 0.14; }
      100% { transform: scale(1.15) translate(30px, 30px); opacity: 0.22; }
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.35;
    }

    /* Container Card */
    .login-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem 2.2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 35px rgba(255, 215, 0, 0.05);
      animation: slide-up 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 16px;
      margin-bottom: 1rem;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
      background: linear-gradient(135deg, #fff 40%, var(--primary-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }

    .brand-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .error-box {
      display: none;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 77, 79, 0.12);
      border: 1px solid rgba(255, 77, 79, 0.3);
      color: #ff7875;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: rgba(10, 12, 18, 0.65);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--card-border-focus);
      background: rgba(15, 18, 28, 0.85);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.18);
    }

    .toggle-pass-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .toggle-pass-btn:hover {
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
      color: #0c0d14;
      border: none;
      border-radius: 12px;
      padding: 0.95rem 1.25rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.25);
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
      filter: brightness(1.06);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(12, 13, 20, 0.3);
      border-top-color: #0c0d14;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.76rem;
      color: #555d6e;
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-gold"></div>
  <div class="ambient-glow glow-cyan"></div>
  <div class="scanlines"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="brand-badge ultra-ball-badge" title="Pokéball TCG Engine">
        <svg class="ultra-ball-svg" viewBox="0 0 48 48" width="36" height="36">
          <defs>
            <linearGradient id="loginUltraBlack" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e293b"/>
              <stop offset="100%" stop-color="#090d16"/>
            </linearGradient>
            <linearGradient id="loginUltraGold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFE866"/>
              <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
            <linearGradient id="loginBallWhite" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#cbd5e1"/>
            </linearGradient>
          </defs>
          <circle cx="24" cy="24" r="22" fill="url(#loginBallWhite)" stroke="#090d16" stroke-width="2.5"/>
          <path d="M 2 24 A 22 22 0 0 1 46 24 Z" fill="url(#loginUltraBlack)"/>
          <path d="M 9 14 C 13 8, 20 6, 24 6 C 21 10, 18 16, 15 22 Z" fill="url(#loginUltraGold)"/>
          <path d="M 39 14 C 35 8, 28 6, 24 6 C 27 10, 30 16, 33 22 Z" fill="url(#loginUltraGold)"/>
          <line x1="2" y1="24" x2="46" y2="24" stroke="#090d16" stroke-width="3"/>
          <circle cx="24" cy="24" r="7" fill="#090d16"/>
          <circle cx="24" cy="24" r="4.5" fill="#ffffff" stroke="#00e5ff" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="2" fill="#00e5ff"/>
        </svg>
      </div>
      <h1 class="brand-title">RÉPLICA PROMO</h1>
      <p class="brand-subtitle">POKÉMON TCG · ULTRA BALL COCKPIT</p>
    </div>

    <div id="error-alert" class="error-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="error-message">Usuário ou senha incorretos</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Usuário</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input type="text" id="username" class="form-input" placeholder="Seu login" autocomplete="username" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input type="password" id="password" class="form-input" placeholder="Sua senha de acesso" autocomplete="current-password" required>
          <button type="button" id="toggle-pass" class="toggle-pass-btn" title="Mostrar/Ocultar senha">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-submit">
        <span class="spinner" id="btn-spinner"></span>
        <span id="btn-text">Entrar no Cockpit</span>
      </button>
    </form>

    <div class="login-footer">
      Sessão criptografada segura por 30 dias · Railway Cloud
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const togglePassBtn = document.getElementById('toggle-pass');
    const eyeIcon = document.getElementById('eye-icon');
    const submitBtn = document.getElementById('btn-submit');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnText = document.getElementById('btn-text');
    const errorAlert = document.getElementById('error-alert');
    const errorMessage = document.getElementById('error-message');

    // Alternar visibilidade da senha
    togglePassBtn.addEventListener('click', () => {
      const isPass = passInput.getAttribute('type') === 'password';
      passInput.setAttribute('type', isPass ? 'text' : 'password');
      eyeIcon.innerHTML = isPass
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorAlert.style.display = 'flex';
    }

    function hideError() {
      errorAlert.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const username = userInput.value.trim();
      const password = passInput.value;

      if (!username || !password) {
        showError('Preencha o usuário e a senha.');
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Autenticando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.ok) {
          btnText.textContent = 'Acesso Autorizado!';
          submitBtn.style.background = 'linear-gradient(135deg, #00e676 0%, #00b0ff 100%)';
          window.location.href = '/';
        } else {
          showError(data.error || 'Credenciais inválidas.');
          submitBtn.disabled = false;
          btnSpinner.style.display = 'none';
          btnText.textContent = 'Entrar no Cockpit';
          passInput.focus();
          passInput.select();
        }
      } catch (err) {
        showError('Erro de conexão ao servidor. Tente novamente.');
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Entrar no Cockpit';
      }
    });
  </script>
</body>
</html>
