<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Cockpit · Promo Pokémon TCG</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070d17;
      --header-bg: rgba(10, 18, 30, 0.92);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-water: #00e5ff;
      --accent-fire: #f97316;
      --accent-emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar de Comando Unificado */
    .super-topbar {
      height: 56px;
      min-height: 56px;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    /* Brand */
    .super-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-text span {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-water);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Módulo Switcher Pills */
    .module-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .nav-pill:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-pill.active-water {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.35), rgba(0, 229, 255, 0.25));
      color: #ffffff;
      border: 1px solid rgba(0, 229, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
    }

    .nav-pill.active-fire {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.35), rgba(249, 115, 22, 0.25));
      color: #ffffff;
      border: 1px solid rgba(249, 115, 22, 0.4);
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.2);
    }

    .nav-pill.active-emerald {
      background: linear-gradient(135deg, rgba(5, 150, 105, 0.35), rgba(16, 185, 129, 0.25));
      color: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }

    /* Actions & Badges */
    .super-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chip-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .chip-badge:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .chip-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
    }

    .chip-badge.connected {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.3);
      background: rgba(52, 211, 153, 0.08);
    }
    .chip-badge.connected .dot {
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    .chip-badge.warning {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.35);
      background: rgba(251, 191, 36, 0.08);
    }
    .chip-badge.warning .dot {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
    }

    .chip-badge.disconnected .dot {
      background: #ef4444;
    }

    .btn-super-logout {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-super-logout:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Workspace Frames */
    .workspace-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
      background: #000000;
    }

    .workspace-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    .workspace-frame.visible {
      display: block;
    }

    @media (max-width: 900px) {
      .super-brand .brand-text span {
        display: none;
      }
      .nav-pill span {
        font-size: 12px;
      }
      .chip-badge {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Top Bar de Comando Unificado -->
  <header class="super-topbar">
    <div class="super-brand" onclick="switchModule('replica')">
      <div class="brand-icon">
        <svg viewBox="0 0 48 48" width="28" height="28">
          <circle cx="24" cy="24" r="22" fill="#cbd5e1" stroke="#082f49" stroke-width="2.5"/>
          <path d="M 2 24 A 22 22 0 0 1 46 24 Z" fill="#0284c7"/>
          <path d="M 10 14 C 14 9, 19 7, 24 7 C 22 11, 20 16, 17 22 Z" fill="#00e5ff"/>
          <path d="M 38 14 C 34 9, 29 7, 24 7 C 26 11, 28 16, 31 22 Z" fill="#00e5ff"/>
          <line x1="2" y1="24" x2="46" y2="24" stroke="#082f49" stroke-width="3"/>
          <circle cx="24" cy="24" r="7" fill="#082f49"/>
          <circle cx="24" cy="24" r="4.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="24" cy="24" r="2" fill="#00e5ff"/>
        </svg>
      </div>
      <div class="brand-text">
        <h2>Promo Pokémon TCG</h2>
        <span>Super Cockpit Unificado</span>
      </div>
    </div>

    <!-- Navegação Central de Módulos -->
    <nav class="module-nav">
      <button class="nav-pill active-water" id="pill-replica" onclick="switchModule('replica')">
        <span>💧</span>
        <span>Replicador de Ofertas</span>
      </button>
      <button class="nav-pill" id="pill-bot" onclick="switchModule('bot')">
        <span>🔥</span>
        <span>Disparador & IA</span>
      </button>
      <button class="nav-pill" id="pill-financas" onclick="switchModule('financas')">
        <span>💼</span>
        <span>Finanças & DRE</span>
      </button>
    </nav>

    <!-- Badges de Conexão e Ações -->
    <div class="super-actions">
      <div class="chip-badge" id="badge-meli">
        <span class="dot"></span>
        <span id="badge-meli-text">meli.la Ativo</span>
      </div>

      <div class="chip-badge" id="badge-wa-replica">
        <span class="dot"></span>
        <span id="badge-wa-replica-text">💧 Replicador: Off</span>
      </div>

      <div class="chip-badge" id="badge-wa-bot">
        <span class="dot"></span>
        <span id="badge-wa-bot-text">🔥 Disparador: Off</span>
      </div>

      <button class="btn-super-logout" id="btn-logout-all" title="Encerrar Sessão">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Sair</span>
      </button>
    </div>
  </header>

  <!-- Workspaces Isolados (Zero Conflito de CSS / Zero Quebra de JS) -->
  <main class="workspace-container">
    <iframe id="frame-replica" class="workspace-frame visible" src="/replica.html"></iframe>
    <iframe id="frame-bot" class="workspace-frame" src="/bot/"></iframe>
  </main>

  <script>
    // Gerenciador de Módulos do Super Cockpit
    function switchModule(moduleName) {
      const frameReplica = document.getElementById('frame-replica');
      const frameBot = document.getElementById('frame-bot');
      const pillReplica = document.getElementById('pill-replica');
      const pillBot = document.getElementById('pill-bot');
      const pillFinancas = document.getElementById('pill-financas');

      [pillReplica, pillBot, pillFinancas].forEach(p => {
        p.className = 'nav-pill';
      });

      if (moduleName === 'replica') {
        pillReplica.className = 'nav-pill active-water';
        frameReplica.classList.add('visible');
        frameBot.classList.remove('visible');
      } else if (moduleName === 'bot') {
        pillBot.className = 'nav-pill active-fire';
        frameBot.classList.add('visible');
        frameReplica.classList.remove('visible');
      } else if (moduleName === 'financas') {
        pillFinancas.className = 'nav-pill active-emerald';
        frameBot.classList.add('visible');
        frameReplica.classList.remove('visible');

        // Tentar ativar a aba de finanças dentro do iframe do bot
        try {
          const botDoc = frameBot.contentDocument || frameBot.contentWindow.document;
          if (botDoc) {
            const btnFinancas = botDoc.querySelector('[data-tab="financas"]');
            if (btnFinancas) btnFinancas.click();
          }
        } catch (e) {
          // Cross-frame protection fallback
        }
      }
    }

    // Poller de Status Unificado para o Header
    async function updateSuperHeaderStatus() {
      try {
        const res = await fetch('/api/unified-status');
        if (res.ok) {
          const data = await res.json();

          // 1. Replicador WA
          const waBadge = document.getElementById('badge-wa-replica');
          const waText = document.getElementById('badge-wa-replica-text');
          const repWa = data.replica && data.replica.whatsapp;
          const repStatus = typeof repWa === 'object' ? (repWa && repWa.status) : repWa;

          if (waBadge && waText) {
            if (repStatus === 'connected') {
              waText.textContent = '💧 Replicador: Online';
              waBadge.className = 'chip-badge connected';
              waBadge.title = 'Chip do Replicador conectado e monitorando grupos';
            } else if (repStatus === 'qr') {
              waText.textContent = '💧 Replicador: Escanear QR';
              waBadge.className = 'chip-badge warning';
              waBadge.title = 'Clique para abrir e escanear o QR Code no seu celular';
            } else if (repStatus === 'connecting') {
              waText.textContent = '💧 Replicador: Conectando...';
              waBadge.className = 'chip-badge warning';
              waBadge.title = 'Estabelecendo conexão com o WhatsApp...';
            } else {
              waText.textContent = '💧 Replicador: Desconectado';
              waBadge.className = 'chip-badge disconnected';
              waBadge.title = 'Clique para conectar o Chip do Replicador';
            }
          }

          // 2. Disparador WA
          const botBadge = document.getElementById('badge-wa-bot');
          const botText = document.getElementById('badge-wa-bot-text');
          const bWa = data.bot && data.bot.whatsapp;
          const bStatus = typeof bWa === 'object' ? (bWa && bWa.status) : bWa;

          if (botBadge && botText) {
            if (bStatus === 'connected') {
              botText.textContent = '🔥 Disparador: Online';
              botBadge.className = 'chip-badge connected';
              botBadge.title = 'Chip do Disparador conectado e pronto para envios';
            } else if (bStatus === 'qr') {
              botText.textContent = '🔥 Disparador: Escanear QR';
              botBadge.className = 'chip-badge warning';
              botBadge.title = 'Clique para abrir e escanear o QR Code do Disparador';
            } else if (bStatus === 'connecting') {
              botText.textContent = '🔥 Disparador: Conectando...';
              botBadge.className = 'chip-badge warning';
              botBadge.title = 'Estabelecendo conexão do Disparador...';
            } else {
              botText.textContent = '🔥 Disparador: Desconectado';
              botBadge.className = 'chip-badge disconnected';
              botBadge.title = 'Clique para abrir o módulo do Disparador';
            }
          }

          // 3. Mercado Livre Sentinel
          const meliBadge = document.getElementById('badge-meli');
          const meliText = document.getElementById('badge-meli-text');
          const meliValid = data.replica && data.replica.cookieStatus && data.replica.cookieStatus.status === 'valid';
          if (meliBadge && meliText) {
            if (meliValid) {
              meliText.textContent = '🛒 meli.la Ativo';
              meliBadge.className = 'chip-badge connected';
              meliBadge.title = 'Cookie do Mercado Livre operacional';
            } else {
              meliText.textContent = '⚠️ meli.la: Renovar Cookie';
              meliBadge.className = 'chip-badge warning';
              meliBadge.title = 'Clique para renovar o cookie de afiliado Mercado Livre';
            }
          }
        }
      } catch (err) {
        // Ignorar falhas transitórias de conexão
      }
    }

    // Ações de clique direto nos badges para facilitar a operação
    document.getElementById('badge-wa-replica').addEventListener('click', () => {
      switchModule('replica');
      try {
        const frame = document.getElementById('frame-replica');
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (doc) {
          const tabBtn = doc.querySelector('[data-tab="conectar"]');
          if (tabBtn) tabBtn.click();
        }
      } catch (e) {}
    });

    document.getElementById('badge-wa-bot').addEventListener('click', () => {
      switchModule('bot');
      try {
        const frame = document.getElementById('frame-bot');
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (doc) {
          const tabBtn = doc.querySelector('[data-tab="dashboard"]');
          if (tabBtn) tabBtn.click();
        }
      } catch (e) {}
    });

    document.getElementById('badge-meli').addEventListener('click', () => {
      switchModule('replica');
      try {
        const frame = document.getElementById('frame-replica');
        const doc = frame.contentDocument || frame.contentWindow.document;
        if (doc) {
          const btnCookie = doc.getElementById('btn-open-cookie-modal') || doc.querySelector('[id*="cookie"]');
          if (btnCookie) btnCookie.click();
        }
      } catch (e) {}
    });

    updateSuperHeaderStatus();
    setInterval(updateSuperHeaderStatus, 5000);

    // Logout Unificado
    document.getElementById('btn-logout-all').addEventListener('click', async () => {
      if (confirm('Deseja realmente sair da plataforma?')) {
        try {
          await fetch('/api/auth/logout', { method: 'POST' });
        } finally {
          window.location.href = '/login.html';
        }
      }
    });
  </script>
</body>
</html>
