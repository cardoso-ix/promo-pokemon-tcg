# Evolution API: ponte entre o WhatsApp do Eduardo e o n8n.
#
# Aplicado na VPS 1897392 como projeto Docker "evolution-api" (Hostinger Docker Manager),
# que guarda este arquivo em /docker/evolution-api/docker-compose.yml.
#
# Tres decisoes que valem explicacao:
#   1. A porta 8080 fica publicada SO em 127.0.0.1. A API tem poder total sobre a conta de
#      WhatsApp, entao ela nao pode ficar aberta na internet. Para ler o QR code, use tunel
#      SSH (veja docs/runbook.md, secao "Conectar o WhatsApp").
#   2. O banco e o mesmo Postgres do bot (container pokemon-postgres), em schema separado.
#      Isso evita subir um segundo Postgres na VPS. O schema evolution e criado pelo workflow
#      Replica Schema Setup, no n8n, e nao por um passo de init aqui.
#   3. A senha do banco viaja percent-encoded dentro da URI (%24 no lugar de $). A senha tem
#      um $, e $ nao escapado ja foi engolido pelo Compose neste projeto uma vez.
#
# A rede n8n_default e a mesma do n8n e do Postgres: e o que permite ao n8n chamar
# http://evolution-api:8080 sem passar pela internet.

services:
  evolution-api:
    # Repositorio oficial atual do projeto. O antigo atendai/evolution-api simplesmente nao
    # sobe nesta VPS: o docker aceita o comando, nao cria container e nao deixa log. Trocar
    # de repositorio resolveu na hora.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Endereco que a Evolution anuncia no campo server_url de cada webhook. O n8n usa esse
      # valor para baixar a imagem da promo, entao ele precisa ser resolvivel de dentro da rede.
      SERVER_URL: http://evolution-api:8080

      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_replica

      # Guardar so o minimo: a replica le a mensagem no ar e nao precisa de historico.
      # Historico completo em disco cresce rapido e nao serve para nada aqui.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      # Webhook global: toda instancia manda evento para o mesmo endereco do n8n.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "false"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "false"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_EVENTS_CHATS_UPSERT: "false"
      WEBHOOK_EVENTS_CHATS_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_DELETE: "false"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "false"
      WEBHOOK_EVENTS_GROUPS_UPDATE: "false"
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: "false"
      WEBHOOK_EVENTS_CALL: "false"
      WEBHOOK_EVENTS_TYPEBOT_START: "false"
      WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS: "false"

      WEBSOCKET_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      DIFY_ENABLED: "false"

      # Aparece no celular na lista de aparelhos conectados.
      CONFIG_SESSION_PHONE_CLIENT: Promo Pokemon TCG
      CONFIG_SESSION_PHONE_NAME: Chrome

      QRCODE_LIMIT: "10"
      DEL_INSTANCE: "false"

      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error

      TZ: America/Sao_Paulo

    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - n8n_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  evolution_instances:

networks:
  n8n_default:
    external: true
