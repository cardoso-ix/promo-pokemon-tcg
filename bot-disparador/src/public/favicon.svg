<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Azul Pokébola Tecnológica -->
    <linearGradient id="pokeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Gradiente de Brilho Ciano / Gemini -->
    <linearGradient id="pokeGeminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Gradiente Metálico Base Inferior -->
    <linearGradient id="darkBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Efeito de Brilho Neon (Glow) -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Anel Externo com Borda Neon Azul -->
  <circle cx="32" cy="32" r="30" fill="#080b11" stroke="url(#pokeBlueGrad)" stroke-width="2.5" />

  <!-- Metade Superior (Pokébola Azul Metálica) -->
  <path d="M 4 32 A 28 28 0 0 1 60 32 Z" fill="url(#pokeBlueGrad)" />

  <!-- Detalhes Superiores Esportivos/Cyber estilo Great Ball (Acentos Gemini Roxos/Cianos) -->
  <path d="M 12 18 C 16 13, 24 10, 27 10 L 25 18 C 22 18, 17 19, 12 18 Z" fill="url(#pokeGeminiGrad)" opacity="0.9" />
  <path d="M 52 18 C 48 13, 40 10, 37 10 L 39 18 C 42 18, 47 19, 52 18 Z" fill="url(#pokeGeminiGrad)" opacity="0.9" />

  <!-- Metade Inferior (Base Escura Tecnológica) -->
  <path d="M 4 32 A 28 28 0 0 0 60 32 Z" fill="url(#darkBaseGrad)" />

  <!-- Faixa Central Divisória (Preto Cyber) -->
  <rect x="2" y="29.5" width="60" height="5" fill="#080b11" />

  <!-- Botão Central Externo (Com Brilho Ciano Neon) -->
  <circle cx="32" cy="32" r="10" fill="#080b11" stroke="url(#pokeGeminiGrad)" stroke-width="2.5" filter="url(#blueGlow)" />

  <!-- Botão Núcleo Interno Branco com Reflexo -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" />
  <circle cx="30.5" cy="30.5" r="1.5" fill="#e0f2fe" opacity="0.8" />
</svg>
