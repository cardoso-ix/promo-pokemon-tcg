version: '3.8'

services:
  promo-replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promo-replica-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - ./data:/app/data

  bot-disparador:
    build:
      context: ./bot-disparador
      dockerfile: Dockerfile
    container_name: bot-disparador-ia
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - NODE_ENV=production
    volumes:
      - ./bot-disparador/data:/app/data
