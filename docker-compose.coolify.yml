services:
  promo-replica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promo-replica-bot
    restart: unless-stopped
    ports:
      - "${PROMO_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-promo2026}
      - SESSION_SECRET=${SESSION_SECRET:-promo-secret-super-seguro-vps-2026}
      - MATT_WORD=${MATT_WORD:-caed1312314}
      - MATT_TOOL=${MATT_TOOL:-96097202}
      - DISPARADOR_URL=http://bot-disparador:3333
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-promo-internal-key-2026}
      - SYNC_DISPARADOR=${SYNC_DISPARADOR:-true}
    volumes:
      - replica_data:/app/data
    networks:
      - promo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.promo-replica.rule=Host(`${PROMO_DOMAIN:-promo.localhost}`)"
      - "traefik.http.routers.promo-replica.entrypoints=websecure"
      - "traefik.http.routers.promo-replica.tls.certresolver=letsencrypt"
      - "traefik.http.services.promo-replica.loadbalancer.server.port=3000"

volumes:
  replica_data:
    name: promo_replica_data

networks:
  promo-network:
    name: promo_network
    driver: bridge
